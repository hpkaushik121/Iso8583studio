# Builds the Angular site and deploys the prerendered output to GitHub Pages.
#
# The build is fully static: every route is prerendered to its own index.html,
# so crawlers that do not run JavaScript — including the AI crawlers robots.txt
# allows — receive complete HTML.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'web/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The payments values live on the github-pages environment, and an
    # environment's variables and secrets are readable only by a job that uses
    # that environment. The build is where they are needed — they are baked
    # into the bundle at compile time, long before the deploy job runs — so the
    # build has to name it too, not just deploy.
    environment: github-pages
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Angular 22 requires ^22.22.3 || ^24.15.0 || >=26.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Regenerates the blog and page content modules, builds and prerenders
      # every route, then writes the sitemap, the legacy .html redirect stubs
      # and 404.html.
      - name: Build
        run: npm run build
        env:
          # The pmk_pub_ browser credential. Public by construction — it ships
          # in the page source, and the Origin binding, the self-serve
          # price-point allowlist and the rate limit are what bound it, not
          # secrecy. Resolved from the environment first and the repository
          # second, and from either a variable or a secret, so it works
          # wherever it has been put.
          # Unset is a supported state: checkout stays off and the form says so.
          PAYMENTS_PUB_KEY: ${{ vars.PAYMENTS_PUB_KEY || secrets.PAYMENTS_PUB_KEY }}
          # Comma-separated SKUs, which must also be published for the tenant
          # in browser_checkout_price_points.
          PAYMENTS_PRICE_POINTS: ${{ vars.PAYMENTS_PRICE_POINTS || secrets.PAYMENTS_PRICE_POINTS }}

      # Replaces the old file-existence check. Fails the deploy if a route is
      # missing, an internal link is broken, a URL still carries .html, the
      # sitemap disagrees with the output, a legacy redirect stub is gone, or
      # any URL that is live today would start returning 404.
      # Keeps the design system's token discipline: no hex literals or raw px
      # font sizes outside src/styles/_tokens.css.
      - name: Lint stylesheets
        run: npm run lint:css

      - name: Verify links and URLs
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist/iso8583-studio/browser'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
