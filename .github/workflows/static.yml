# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      # Redeploy when the pipeline itself changes.
      - '.github/workflows/static.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The home page is assembled from assets/site.js (header, footer, nav),
      # assets/analytics.js (GA4) and three screenshots. Any one of them
      # missing renders a broken site, so fail here rather than deploy it.
      - name: Verify site payload
        run: |
          set -euo pipefail
          missing=0
          for f in \
            docs/index.html \
            docs/CNAME \
            docs/robots.txt \
            docs/sitemap.xml \
            docs/assets/site.js \
            docs/assets/analytics.js \
            docs/images/app.png \
            docs/images/img.png \
            docs/images/img_1.png \
            docs/images/img_3.png
          do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::required file is missing or empty"
              missing=1
            fi
          done
          # The home page must load both scripts, or the redesign ships unstyled
          # and untracked.
          grep -q 'assets/site.js' docs/index.html || {
            echo "::error file=docs/index.html::site.js is not referenced"; missing=1; }
          grep -q 'assets/analytics.js' docs/index.html || {
            echo "::error file=docs/index.html::analytics.js is not referenced"; missing=1; }
          exit $missing

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
