<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ISO8583Studio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/images/logo-mark.svg" type="image/svg+xml">
  <link rel="icon" href="/images/app.png" type="image/png">
  <link rel="shortcut icon" href="/images/app.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <!--
    New Relic browser agent.

    The configuration is exactly the snippet New Relic generates for this app;
    only the agent itself is loaded from their CDN instead of being pasted
    inline. The inline copy is ~80KB of script in the document, and this site
    prerenders 105 of them, so none of it would ever be cached. From the CDN it
    is 28KB gzipped once, with a one-year cache, shared by every page.

    nr-loader-spa is the right build: the site is an Angular SPA, so route
    changes are soft navigations rather than document loads.

    Before the AdSense tag and immediately after the consent defaults, so the
    agent is watching early enough to catch errors from the rest of the head.

    The licence key here is a browser key (NRJS- prefix) and is public by
    construction, like the AdSense client id below.

    Worth knowing: browser_consent_mode is off and cookies are enabled in this
    config, so the agent collects regardless of the cookie banner — unlike the
    Google tags above, which the banner gates. Session replay masks all text
    and all inputs, so the enquiry form's contents are not captured, but the
    session is still recorded.
  -->
  <script>
    window.NREUM || (NREUM = {});
    NREUM.init = {
      browser_consent_mode: { enabled: false },
      privacy: { cookies_enabled: true },
      session_replay: {
        enabled: true, block_selector: '', mask_text_selector: '*',
        sampling_rate: 10.0, error_sampling_rate: 100.0, mask_all_inputs: true,
        collect_fonts: true, inline_images: false, inline_stylesheet: true,
        fix_stylesheets: true, preload: false, mask_input_options: {},
      },
      distributed_tracing: { enabled: true },
      performance: { capture_measures: true },
      // Without this the agent would instrument its own beacon and loop.
      ajax: { deny_list: ['bam.eu01.nr-data.net'], capture_payloads: 'none' },
    };
    NREUM.loader_config = {
      accountID: '8593848', trustKey: '8593848', agentID: '538911667',
      licenseKey: 'NRJS-b77fb49cda40242b5bd', applicationID: '538911667',
    };
    NREUM.info = {
      beacon: 'bam.eu01.nr-data.net', errorBeacon: 'bam.eu01.nr-data.net',
      licenseKey: 'NRJS-b77fb49cda40242b5bd', applicationID: '538911667', sa: 1,
    };
  </script>
  <script async src="https://js-agent.newrelic.com/nr-loader-spa-1.323.0.min.js"></script>

  <!--
    Google AdSense. Here rather than injected from a component because every
    route is prerendered from this one shell, so this is the only place that
    reaches all of them — including the legacy .html aliases postbuild writes.
    async, so it never blocks first paint.
  -->
  <!--
    Suppressed for paid sessions (?src=ads or a Google click id): paying for a
    click and then showing that visitor display ads is both bad economics and
    the exact landing-page pattern Ads' quality signal punishes. The flag is
    kept in sessionStorage so the suppression survives in-site navigation.

    This script is the single writer of that flag; core/analytics.ts only reads
    it, through paidSession().

    Consent Mode is set up here, before the AdSense loader, and not in
    core/analytics.ts. AdSense reads consent off this same dataLayer, and the
    Angular bundle does not run until long after this tag has loaded — so
    defaults pushed from there arrived too late to govern it, and an EEA
    visitor could be served personalised ads before the deny default existed.
    The region list and the storage key are duplicated from
    core/analytics.ts (CONSENT_DENY_REGIONS, CONSENT_KEY); keep the two in step.
  -->
  <script>
    (function () {
      // The standard stub: it must push the `arguments` object, not an array —
      // gtag.js ignores a plain array, which is the bug core/analytics.ts's
      // own gtag() goes out of its way to avoid.
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;

      // EU-27 + EEA three + UK + CH. The more specific default wins for a
      // matching visitor, so declaration order does not matter.
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied',
        ad_personalization: 'denied', analytics_storage: 'denied',
        region: ['AT', 'BE', 'BG', 'CY', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR',
                 'GR', 'HR', 'HU', 'IE', 'IT', 'LT', 'LU', 'LV', 'MT', 'NL', 'PL',
                 'PT', 'RO', 'SE', 'SI', 'SK', 'IS', 'LI', 'NO', 'GB', 'CH'],
        wait_for_update: 500,
      });
      gtag('consent', 'default', {
        ad_storage: 'granted', ad_user_data: 'granted',
        ad_personalization: 'granted', analytics_storage: 'granted',
      });
      // Replay a stored choice now, so a returning visitor's decision also
      // governs AdSense. Mirrors AnalyticsService.applyConsent.
      try {
        var choice = localStorage.getItem('iso8583-cookie-consent');
        if (choice) {
          var ad = choice === 'all' ? 'granted' : 'denied';
          gtag('consent', 'update', {
            ad_storage: ad, ad_user_data: ad, ad_personalization: ad,
            analytics_storage: 'granted',
          });
        }
      } catch (e) { /* private mode: the defaults above stand */ }

      var KEY = 'iso8583_paid_session';
      try {
        var q = new URLSearchParams(location.search);
        if (q.get('src') === 'ads' || q.has('gclid') || q.has('gbraid') || q.has('wbraid')) {
          sessionStorage.setItem(KEY, '1');
        }
        if (sessionStorage.getItem(KEY) === '1') return;
      } catch (e) { /* private mode: fall through and load ads */ }
      var s = document.createElement('script');
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8756347363236718';
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
